<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — PawTrack</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <img class="brand-mark" src="assets/logo.svg" width="30" height="30" alt="">
      <span class="brand-name">PawTrack</span>
    </a>
    <nav class="header-nav">
      <span class="nav-link">Admin</span>
    </nav>
  </div>
</header>

<main class="container">

  <section id="loginPanel" class="admin-login">
    <h1>Admin Log In</h1>
    <p class="admin-sub">Staff access only.</p>
    <form id="loginForm">
      <label class="field">
        <span>Email</span>
        <input type="email" id="loginEmail" required autocomplete="username">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </label>
      <p id="loginError" class="login-error" hidden>Incorrect email or password.</p>
      <button type="submit" class="btn btn-primary">Log In</button>
    </form>
  </section>

  <section id="dashboardPanel" class="admin-dashboard" hidden>
    <div class="admin-header">
      <h1>Create a Shipment</h1>
      <button id="logoutBtn" class="btn btn-danger btn-small">Log Out</button>
    </div>

    <form id="createShipmentForm" class="admin-form">
      <div class="field-row">
        <label class="field">
          <span>Pet Name</span>
          <input type="text" id="newPetName" required maxlength="40">
        </label>
        <label class="field">
          <span>Species</span>
          <select id="newSpecies" required>
            <option value="dog">Dog</option>
            <option value="cat">Cat</option>
          </select>
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>Breed</span>
          <input type="text" id="newBreed" maxlength="60">
        </label>
        <label class="field">
          <span>Age</span>
          <input type="text" id="newAge" placeholder="e.g. 2 years" maxlength="30">
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>Origin</span>
          <select id="newOrigin" required>
            <option>San Antonio, TX</option>
            <option>Dallas, TX</option>
            <option>Houston, TX</option>
            <option>Austin, TX</option>
          </select>
        </label>
        <label class="field">
          <span>Destination</span>
          <select id="newDestination" required>
            <option>Dallas, TX</option>
            <option>San Antonio, TX</option>
            <option>Houston, TX</option>
            <option>Austin, TX</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span>Photo (optional)</span>
        <input type="file" id="newPhoto" accept="image/*">
      </label>

      <label class="field">
        <span>Notes</span>
        <textarea id="newNotes" rows="2" maxlength="300" placeholder="e.g. Shipment booked and confirmed."></textarea>
      </label>

      <h3 class="form-section-heading">Receiver Information</h3>
      <p class="form-section-note">Kept for internal records only — never shown on the public tracking page.</p>

      <label class="field">
        <span>Name</span>
        <input type="text" id="receiverName" required maxlength="80">
      </label>

      <label class="field">
        <span>Address</span>
        <input type="text" id="receiverAddress" required maxlength="150">
      </label>

      <div class="field-row">
        <label class="field">
          <span>Country</span>
          <input type="text" id="receiverCountry" required maxlength="60" value="United States">
        </label>
        <label class="field">
          <span>Phone Number</span>
          <input type="tel" id="receiverPhone" required maxlength="30">
        </label>
      </div>

      <label class="field">
        <span>Email Address</span>
        <input type="email" id="receiverEmail" required maxlength="100">
      </label>

      <button type="submit" class="btn btn-primary">Generate Tracking Number</button>
    </form>

    <div id="createResult" class="create-result" hidden>
      <p>Tracking number created:</p>
      <div class="tracking-number-big" id="resultTrackingNumber"></div>
      <a id="resultTrackLink" href="index.html" class="btn btn-primary btn-small">View on Tracking Page</a>
    </div>

    <h2 class="admin-subheading">Shipments</h2>
    <div id="shipmentList"></div>
  </section>

</main>

<script src="js/shipments.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
